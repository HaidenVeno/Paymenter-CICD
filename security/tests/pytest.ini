[pytest]
addopts = -ra -q --junitxml=security-tests-results.xml
markers =
    edge: assertion enforced at the reverse-proxy/edge (needs only BASE_URL)
    needs_auth: requires an authenticated token/cookie/session via env
    needs_docker: requires docker access to the running paymenter container
    open_finding: disclosed but not yet patched; xfail-tracked, not a gate
testpaths =
    auth
    api
    fuzzing
