name: CI — SAST & SCA

on:
  push:
  pull_request:
  workflow_dispatch:

# The application source lives in the group's fork, separate from this pipeline
# repo. Override these as repo variables if the branch/fork changes.
env:
  APP_REPO: ${{ vars.APP_REPO || 'HaidenVeno/Paymenter' }}
  APP_REF:  ${{ vars.APP_REF  || 'fix/upgrade-configoptions-injection' }}

jobs:
  # ---------------------------------------------------------------------------
  # Static analysis. Split into a BLOCKING custom-rules gate (Lab 3 business
  # logic bugs that `auto` missed) and REPORT-ONLY registry packs (Lab 4 showed
  # these are noisy/false-positive-heavy — informative, not a merge gate).
  # ---------------------------------------------------------------------------
  semgrep:
    runs-on: self-hosted
    steps:
      - name: Checkout pipeline repo (custom rules)
        uses: actions/checkout@v4

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app

      - name: Install Semgrep
        run: pip install semgrep --break-system-packages

      - name: Custom regression rules (blocking)
        # --error => exit non-zero on any finding. These rules are the scripted
        # equivalent of Lab 3/4/5 manual findings; a hit means a fix regressed.
        run: semgrep scan --config security/semgrep/rules --error --sarif --output semgrep-custom.sarif app

      - name: Registry packs (report-only)
        if: always()
        run: semgrep scan --config p/php --config p/security-audit --config p/secrets --sarif --output semgrep-registry.sarif app || true

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-*.sarif

  # ---------------------------------------------------------------------------
  # ESLint (eslint-plugin-security) over the app's only first-party JS
  # (themes/default/js). Lab 4 s3.2 established this is the entire JS scope.
  # ---------------------------------------------------------------------------
  eslint-security:
    runs-on: self-hosted
    steps:
      - name: Checkout pipeline repo (eslint config)
        uses: actions/checkout@v4

      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app

      - name: Install ESLint + security plugin
        working-directory: security/eslint-security
        run: npm ci

      - name: Run ESLint security scan
        working-directory: security/eslint-security
        run: >-
          npx eslint
          --config eslint.config.mjs
          "../../app/themes/default/js/**/*.js"
          -f json -o "$GITHUB_WORKSPACE/eslint-results.json"

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-results.json

  # ---------------------------------------------------------------------------
  # Software Composition Analysis. Fails on High/Critical (CVSS >= 7) to match
  # the Snyk criticals Lab 4/5 found in the composer dependency tree.
  # ---------------------------------------------------------------------------
  dependency-check:
    runs-on: self-hosted
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'paymenter'
          path: 'app'
          format: 'HTML'
          # NVD API key avoids rate-limited feed updates on the self-hosted runner.
          args: >-
            --failOnCVSS 7
            --enableRetired
            ${{ secrets.NVD_API_KEY && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ---------------------------------------------------------------------------
  # Developer notification — fires only if a scan gate above fails (Stage 4).
  # ---------------------------------------------------------------------------
  notify:
    needs: [semgrep, eslint-security, dependency-check]
    if: failure()
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      - name: Post to Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"Security scan failed on ${{ github.repository }} @ ${{ github.ref_name }} — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security scan failure — run ${context.runId}`,
              body: `A CI security scan (SAST/SCA) failed on \`${context.ref}\`.\n\n` +
                    `See the run for the failing job and artifacts:\n` +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security']
            });
