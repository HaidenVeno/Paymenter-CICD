name: CI — SAST, Secrets, IaC & SCA

on:
  push:
  pull_request:
  workflow_dispatch:

# The application source lives in the group's fork, separate from this pipeline
# repo. Override these as repo variables if the branch/fork changes.
env:
  APP_REPO: ${{ vars.APP_REPO || 'HaidenVeno/Paymenter' }}
  APP_REF:  ${{ vars.APP_REF  || 'fix/upgrade-configoptions-injection' }}

jobs:
  # ---------------------------------------------------------------------------
  # SAST — Semgrep. Two tiers, calibrated against the real app:
  #   * BLOCKING gate: custom rules + p/default + p/owasp-top-ten, filtered to
  #     ERROR severity. This is the high-confidence subset — 0 findings on the
  #     current app, but it fires on real injection (command exec, eval, etc.).
  #   * REPORT-ONLY: the full p/default + p/security-audit + p/secrets set. On
  #     this app that surfaces ~38 mostly-WARNING findings (dominated by the
  #     Symfony non-literal-redirect false positives Lab 4 documented), so it is
  #     archived as a SARIF artifact for review, not gated.
  # ---------------------------------------------------------------------------
  semgrep:
    runs-on: self-hosted
    steps:
      - name: Checkout pipeline repo (custom rules)
        uses: actions/checkout@v4
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
      - name: Install Semgrep
        run: pip install semgrep --break-system-packages

      - name: Blocking gate — ERROR severity (custom + p/default + OWASP Top 10)
        run: >-
          semgrep scan
          --config security/semgrep/rules
          --config p/default
          --config p/owasp-top-ten
          --severity ERROR --error
          --sarif --output semgrep-blocking.sarif
          app

      - name: Blocking gate — pipeline IaC hardening (custom rules)
        run: semgrep scan --config security/semgrep/rules --error docker ansible scripts

      - name: Report-only — full ruleset (archived, not gated)
        if: always()
        run: >-
          semgrep scan
          --config p/default --config p/security-audit --config p/secrets
          --sarif --output semgrep-report.sarif app || true

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-reports
          path: semgrep-*.sarif

  # ---------------------------------------------------------------------------
  # ESLint (eslint-plugin-security) over the app's first-party JS.
  # ---------------------------------------------------------------------------
  eslint-security:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
      - name: Install ESLint + security plugin
        working-directory: security/eslint-security
        run: npm ci
      - name: Run ESLint security scan
        working-directory: security/eslint-security
        run: >-
          npx eslint --config eslint.config.mjs
          "../../app/themes/default/js/**/*.js"
          -f json -o "$GITHUB_WORKSPACE/eslint-results.json"
      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-report
          path: eslint-results.json

  # ---------------------------------------------------------------------------
  # Secret scanning — Gitleaks. Gates on any detected secret. Calibrated: the
  # current app scans clean. Noise paths are allowlisted in .gitleaks.toml.
  # ---------------------------------------------------------------------------
  gitleaks:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
      - name: Gitleaks secret scan (blocking)
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest
          detect --source=/repo --no-git --redact
          --config=/repo/.gitleaks.toml
          --report-format sarif --report-path /repo/gitleaks.sarif -v
      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks.sarif

  # ---------------------------------------------------------------------------
  # Dockerfile linting — Hadolint. Gates at warning threshold; .hadolint.yaml
  # waives commonly-ignored rules. The hardened Dockerfile passes clean.
  # ---------------------------------------------------------------------------
  hadolint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/Dockerfile.paymenter
          config: .hadolint.yaml
          failure-threshold: warning

  # ---------------------------------------------------------------------------
  # IaC / container misconfig — Trivy config. Gates on HIGH/CRITICAL. Validates
  # the Dockerfile hardening (non-root USER, pinned base, HEALTHCHECK) and fails
  # if any of it regresses. Currently 0 misconfigurations.
  # ---------------------------------------------------------------------------
  trivy-config:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: docker
          severity: HIGH,CRITICAL
          exit-code: '1'
          format: sarif
          output: trivy-config.sarif
      - name: Upload Trivy config report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-config-report
          path: trivy-config.sarif

  # ---------------------------------------------------------------------------
  # Software Composition Analysis — OWASP Dependency-Check. Fails on High+.
  # ---------------------------------------------------------------------------
  dependency-check:
    runs-on: self-hosted
    steps:
      - name: Checkout application source
        uses: actions/checkout@v4
        with:
          repository: ${{ env.APP_REPO }}
          ref: ${{ env.APP_REF }}
          path: app
      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'paymenter'
          path: 'app'
          format: 'HTML'
          args: >-
            --failOnCVSS 7
            --enableRetired
            ${{ secrets.NVD_API_KEY && format('--nvdApiKey {0}', secrets.NVD_API_KEY) || '' }}
      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/

  # ---------------------------------------------------------------------------
  # Developer notification — fires if any scan gate above fails (Stage 4).
  # ---------------------------------------------------------------------------
  notify:
    needs: [semgrep, eslint-security, gitleaks, hadolint, trivy-config, dependency-check]
    if: failure()
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # secrets context isn't allowed in step-level `if:` (actionlint
          # caught this — it was silently failing every workflow's parse,
          # zero jobs created, no runner had ever executed these before).
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL set, skipping."; exit 0
          fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"Security scan failed on ${{ github.repository }} @ ${{ github.ref_name }} — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Security scan failure — run ${context.runId}`,
              body: `A CI security scan failed on \`${context.ref}\`.\n\n` +
                    `Layers: Semgrep (SAST), ESLint, Gitleaks (secrets), Hadolint, ` +
                    `Trivy config (IaC), Dependency-Check (SCA).\n\n` +
                    `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security']
            });
