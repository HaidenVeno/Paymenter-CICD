name: Security Tests & Post-Deploy Validation

# Runs after a successful deploy (Stage 3 regression suite + Stage 6 DAST /
# config audit) against the live homelab instance. Also runnable on demand.
on:
  workflow_run:
    workflows: ["Build, Scan, Deploy"]
    types: [completed]
  workflow_dispatch:

env:
  BASE_URL: ${{ vars.BASE_URL || 'https://paymenter.homelab.local' }}
  VERIFY_TLS: ${{ vars.VERIFY_TLS || 'false' }}
  # Same deploy-target convention as deploy.yml — config-audit checks the
  # actual deploy target (Staging) over SSH, not the runner it executes on.
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '10.0.20.20' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'hveno' }}
  DEPLOY_SSH_KEY: ${{ vars.DEPLOY_SSH_KEY || '/home/hveno/.ssh/id_ed25519_deploy' }}
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/hveno/Paymenter-CICD/docker' }}

jobs:
  gate:
    runs-on: self-hosted
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             [ "${{ github.event.workflow_run.conclusion }}" = "success" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  # ---- Stage 3: scripted security regression suite --------------------------
  regression-tests:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Install test deps
        working-directory: security/tests
        run: pip install -r requirements.txt --break-system-packages
      - name: Run regression suite
        working-directory: security/tests
        env:
          BASE_URL: ${{ env.BASE_URL }}
          VERIFY_TLS: ${{ env.VERIFY_TLS }}
          ADMIN_API_TOKEN: ${{ secrets.ADMIN_API_TOKEN }}
          LOWPRIV_ROLE_ID: ${{ vars.LOWPRIV_ROLE_ID }}
          LOWPRIV_COOKIE: ${{ secrets.LOWPRIV_COOKIE }}
          CUSTOMER_COOKIE: ${{ secrets.CUSTOMER_COOKIE }}
          REMEMBER_COOKIE: ${{ secrets.REMEMBER_COOKIE }}
          EXPIRED_COOKIE: ${{ secrets.EXPIRED_COOKIE }}
          UPGRADE_SERVICE_ID: ${{ vars.UPGRADE_SERVICE_ID }}
          CHECKOUT_CATEGORY_SLUG: ${{ vars.CHECKOUT_CATEGORY_SLUG }}
          CHECKOUT_PRODUCT_SLUG: ${{ vars.CHECKOUT_PRODUCT_SLUG }}
          CHECKOUT_CONFIG_OPTION_ID: ${{ vars.CHECKOUT_CONFIG_OPTION_ID }}
          CHECKOUT_PLAN_ID: ${{ vars.CHECKOUT_PLAN_ID }}
          RACE_COUPON_CODE: ${{ secrets.RACE_COUPON_CODE }}
          RACE_COUPON_SLOTS: ${{ vars.RACE_COUPON_SLOTS }}
          RACE_CUSTOMER_COOKIES: ${{ secrets.RACE_CUSTOMER_COOKIES }}
        # `pip install --break-system-packages` (no --user, but PEP 668 forces
        # user-site anyway) puts the pytest console-script shim in
        # ~/.local/bin, which isn't on PATH for this non-interactive shell —
        # confirmed via pip's own warning in the previous run's log ("scripts
        # py.test and pytest are installed in ... which is not on PATH"),
        # bare `pytest` failed with exit 127. `python3 -m pytest` runs it via
        # the interpreter directly, sidestepping the PATH issue entirely.
        run: python3 -m pytest
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-tests-results
          path: security/tests/security-tests-results.xml
      - if: always()
        uses: ./.github/actions/reclaim-workspace

  # ---- Stage 6: ZAP baseline DAST -------------------------------------------
  post-deploy-zap:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.BASE_URL }}
          rules_file_name: 'security/zap/rules.tsv'
          fail_action: true
          allow_issue_writing: false
          # Without -I, zap-baseline.py exits non-zero on ANY alert, WARN
          # included — fail_action then fails the job even when rules.tsv's
          # own severity classification says WARN-level findings shouldn't
          # gate. -I makes the script's exit code (and thus fail_action)
          # respect that distinction: only a real FAIL-level alert fails the
          # job. Found this when the CSP fix (FAIL-NEW: 0) still failed the
          # job on 7 pre-existing, already-documented WARN findings.
          cmd_options: '-I'
      - if: always()
        uses: ./.github/actions/reclaim-workspace

  # ---- Stage 6: Nikto (informational; diff against Lab 5 baseline) ----------
  # Skippable via the SKIP_NIKTO repo variable — it's the slowest job and only
  # informational (not in notify's needs, continue-on-error), so a run can opt
  # out of it (e.g. a fast full-pipeline exercise) by setting SKIP_NIKTO=true.
  post-deploy-nikto:
    needs: gate
    if: needs.gate.outputs.go == 'true' && vars.SKIP_NIKTO != 'true'
    runs-on: self-hosted
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Run Nikto
        run: |
          if command -v nikto >/dev/null 2>&1; then
            nikto -h "${BASE_URL}" -nossl -o nikto-report.html -Format htm || true
          else
            docker run --rm --network host ghcr.io/sullo/nikto:latest \
              -h "${BASE_URL}" -o - -Format txt > nikto-report.html || true
          fi
      - name: Upload Nikto report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nikto-report
          path: nikto-report.html
      - if: always()
        uses: ./.github/actions/reclaim-workspace

  # ---- Stage 6: config audit (hardening still holds) ------------------------
  post-deploy-config-audit:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Assert hardening still holds
        env:
          BASE_URL: ${{ env.BASE_URL }}
          DEPLOY_HOST: ${{ env.DEPLOY_HOST }}
          DEPLOY_USER: ${{ env.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ env.DEPLOY_SSH_KEY }}
          DEPLOY_PATH: ${{ env.DEPLOY_PATH }}
        run: bash security/tests/config-audit.sh
      - if: always()
        uses: ./.github/actions/reclaim-workspace

  notify:
    needs: [regression-tests, post-deploy-zap, post-deploy-config-audit]
    if: failure()
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # secrets context isn't allowed in step-level `if:` (actionlint
          # caught this — it was silently failing every workflow's parse,
          # zero jobs created, no runner had ever executed these before).
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL set, skipping."; exit 0
          fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"Post-deploy security validation failed on ${{ github.repository }} — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"
      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Post-deploy security validation failure — run ${context.runId}`,
              body: `Regression suite / ZAP / config-audit failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security']
            });
