name: Build, Scan, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_REPO: ${{ vars.APP_REPO || 'HaidenVeno/Paymenter' }}
  APP_REF:  ${{ vars.APP_REF  || 'fix/upgrade-configoptions-injection' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build the hardened image once and tag it with the commit SHA (the exact
  # artifact Trivy scans) AND `paymenter:local` (what compose deploys with
  # --no-build, so the scanned image is the deployed image).
  # ---------------------------------------------------------------------------
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build hardened image
        run: |
          docker build \
            -f docker/Dockerfile.paymenter \
            --build-arg PAYMENTER_REPO=https://github.com/${APP_REPO}.git \
            --build-arg PAYMENTER_REF=${APP_REF} \
            -t paymenter:${{ github.sha }} \
            -t paymenter:local \
            .

  # ---------------------------------------------------------------------------
  # Image vulnerability scan. Report HIGH+CRITICAL as an artifact, then gate:
  # fail the pipeline on unfixed CRITICALs (documented threshold — see
  # docs/test-justification.md).
  # ---------------------------------------------------------------------------
  trivy-scan:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Trivy scan (report HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'paymenter:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: 'paymenter:${{ github.sha }}'
          severity: 'CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

  # ---------------------------------------------------------------------------
  # Provision host hardening + secrets/certs (Ansible), then deploy the
  # already-built, already-scanned image via compose (--no-build).
  # ---------------------------------------------------------------------------
  deploy:
    needs: trivy-scan
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Harden host + provision secrets/certs (Ansible)
        run: ansible-playbook ansible/playbooks/site.yml

      - name: Deploy (scanned image, no rebuild)
        working-directory: docker
        run: docker compose up -d --no-build --remove-orphans

      - name: Wait for app health
        run: |
          for i in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Health.Status}}' $(docker compose -f docker/docker-compose.yml ps -q paymenter) 2>/dev/null)" = "healthy" ]; then
              echo "paymenter healthy"; exit 0
            fi
            echo "waiting for health ($i/30)..."; sleep 5
          done
          echo "app did not become healthy in time"; exit 1

  notify:
    needs: [build, trivy-scan, deploy]
    if: failure()
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      - name: Post to Discord
        if: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
        run: |
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"Build/Scan/Deploy failed on ${{ github.repository }} — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy pipeline failure — run ${context.runId}`,
              body: `Build/Scan/Deploy failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'deploy']
            });
