name: Build, Scan, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  APP_REPO: ${{ vars.APP_REPO || 'HaidenVeno/Paymenter' }}
  APP_REF:  ${{ vars.APP_REF  || 'fix/upgrade-configoptions-injection' }}
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST || '10.0.20.20' }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER || 'hveno' }}
  DEPLOY_SSH_KEY: ${{ vars.DEPLOY_SSH_KEY || '/home/hveno/.ssh/id_ed25519_deploy' }}
  # Absolute, not ~-relative: ~ only expands when a shell parses the literal
  # token itself, and this value passes through quoted variable references
  # (remote `bash -s`, `cd "$DEPLOY_PATH"`) where that never happens. Also
  # matches what secrets.yml/certs.yml/provision.yml already resolve
  # {{ playbook_dir }}/../.. to on the deploy target.
  DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/home/hveno/Paymenter-CICD/docker' }}

jobs:
  # ---------------------------------------------------------------------------
  # Build the hardened image once and tag it with the commit SHA (the exact
  # artifact Trivy scans) AND `paymenter:local` (what compose deploys with
  # --no-build, so the scanned image is the deployed image).
  # ---------------------------------------------------------------------------
  build:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build hardened image
        run: |
          docker build \
            -f docker/Dockerfile.paymenter \
            --build-arg PAYMENTER_REPO=https://github.com/${APP_REPO}.git \
            --build-arg PAYMENTER_REF=${APP_REF} \
            -t paymenter:${{ github.sha }} \
            -t paymenter:local \
            .

      - if: always()
        uses: ./.github/actions/reclaim-workspace

  # ---------------------------------------------------------------------------
  # Image vulnerability scan. Report HIGH+CRITICAL as an artifact, then gate:
  # fail the pipeline on unfixed CRITICALs (documented threshold — see
  # docs/test-justification.md).
  # ---------------------------------------------------------------------------
  trivy-scan:
    needs: build
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Trivy scan (report HIGH,CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'paymenter:${{ github.sha }}'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          exit-code: '0'

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-results.sarif

      - name: Gate on CRITICAL
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: 'paymenter:${{ github.sha }}'
          severity: 'CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      - if: always()
        uses: ./.github/actions/reclaim-workspace

  # ---------------------------------------------------------------------------
  # Provision host (Ansible: user/network/Docker/secrets/certs/firewall) on
  # the deploy target, ship the already-built already-scanned image + compose
  # context to it over the mgmt network, and bring the stack up there. The
  # runner is never the deploy target — see docs/network-topology.md.
  # ---------------------------------------------------------------------------
  deploy:
    needs: trivy-scan
    runs-on: self-hosted
    permissions:
      actions: write  # gh variable set (STAGING_VALIDATED_DIGEST)
    steps:
      - uses: actions/checkout@v4

      - name: "Provision target (Ansible: user/net/Docker/secrets/certs/firewall)"
        run: |
          ansible-playbook -i ansible/inventory.ini ansible/playbooks/site.yml \
            -e ansible_become_pass="${{ secrets.STAGING_BECOME_PASS }}"

      - name: Sync compose context to deploy target
        run: |
          rsync -az --delete --exclude secrets \
            -e "ssh -o StrictHostKeyChecking=accept-new -i $DEPLOY_SSH_KEY" \
            docker/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"

      - name: Ship the scanned image to the deploy target
        run: |
          docker save "paymenter:${{ github.sha }}" paymenter:local | gzip \
            | ssh -o StrictHostKeyChecking=accept-new -i "$DEPLOY_SSH_KEY" \
                "$DEPLOY_USER@$DEPLOY_HOST" "gunzip | docker load"

      - name: Deploy (scanned image, no rebuild)
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i "$DEPLOY_SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          cd "$DEPLOY_PATH"
          docker compose up -d --no-build --remove-orphans
          REMOTE

      - name: Wait for app health
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i "$DEPLOY_SSH_KEY" \
            "$DEPLOY_USER@$DEPLOY_HOST" "DEPLOY_PATH='$DEPLOY_PATH' bash -s" <<'REMOTE'
          for i in $(seq 1 30); do
            cid="$(docker compose -f "$DEPLOY_PATH/docker-compose.yml" ps -q paymenter)"
            status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null)"
            if [ "$status" = "healthy" ]; then
              echo "paymenter healthy"; exit 0
            fi
            echo "waiting for health ($i/30)..."; sleep 5
          done
          echo "app did not become healthy in time"; exit 1
          REMOTE

      # Only a digest that's actually running healthy on Staging gets pushed
      # and recorded — never a built-but-unvalidated image. promote-prod.yml
      # later pulls this exact digest onto Prod-App by content hash, not a
      # mutable tag, so "build once, promote the same bits" is provable, not
      # just intended. Registry is local (see docs/allowlist.md for the
      # TLS/trust design) and reachable over mgmtnet only.
      - name: Push scanned+healthy image to the local registry
        run: |
          docker tag "paymenter:${{ github.sha }}" registry.homelab.local:5000/paymenter:${{ github.sha }}
          docker push registry.homelab.local:5000/paymenter:${{ github.sha }} | tee push.log
          DIGEST=$(grep -oP 'digest: \Ksha256:[0-9a-f]+' push.log)
          echo "Pushed digest: $DIGEST"
          gh variable set STAGING_VALIDATED_DIGEST --body "$DIGEST"
        env:
          GH_TOKEN: ${{ github.token }}

      - if: always()
        uses: ./.github/actions/reclaim-workspace

  notify:
    needs: [build, trivy-scan, deploy]
    if: failure()
    runs-on: self-hosted
    permissions:
      issues: write
    steps:
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          # secrets context isn't allowed in step-level `if:` (actionlint
          # caught this — it was silently failing every workflow's parse,
          # zero jobs created, no runner had ever executed these before).
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "No DISCORD_WEBHOOK_URL set, skipping."; exit 0
          fi
          curl -H "Content-Type: application/json" -X POST \
            -d "{\"content\": \"Build/Scan/Deploy failed on ${{ github.repository }} — run ${{ github.run_id }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
            "$DISCORD_WEBHOOK_URL"

      - name: Open GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Deploy pipeline failure — run ${context.runId}`,
              body: `Build/Scan/Deploy failed. See ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['security', 'deploy']
            });
