# Top-level playbook run by deploy.yml before `docker compose up`.
# Order matters: the host must be reachable/provisioned and have Docker before
# anything else; secrets/certs must exist before the stack starts; host
# hardening (firewall) goes last so it doesn't lock out earlier steps.
---
- import_playbook: provision.yml
- import_playbook: docker.yml
- import_playbook: secrets.yml
- import_playbook: certs.yml
- import_playbook: harden.yml
