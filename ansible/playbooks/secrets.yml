# Provision runtime secrets into docker/secrets/ with strict permissions.
# Files are create-once (never overwritten) so redeploys don't rotate the
# APP_KEY out from under already-encrypted data (Lab 5 s3.4 lesson: don't flip
# secret handling against live data without a migration).
---
- name: Provision Docker secrets
  hosts: homelab
  become: true
  vars:
    repo_root: "{{ playbook_dir }}/../.."
    secrets_dir: "{{ repo_root }}/docker/secrets"

  tasks:
    - name: Ensure secrets directory exists (private)
      ansible.builtin.file:
        path: "{{ secrets_dir }}"
        state: directory
        mode: "0700"

    - name: Generate APP_KEY (32 chars) if absent
      ansible.builtin.shell:
        cmd: "tr -dc 'a-zA-Z0-9' < /dev/urandom | fold -w 32 | head -n 1 > '{{ secrets_dir }}/app_key'"
        creates: "{{ secrets_dir }}/app_key"

    - name: Generate database password if absent
      ansible.builtin.shell:
        cmd: "openssl rand -base64 24 | tr -d '\\n' > '{{ secrets_dir }}/db_password'"
        creates: "{{ secrets_dir }}/db_password"

    - name: Generate database root password if absent
      ansible.builtin.shell:
        cmd: "openssl rand -base64 24 | tr -d '\\n' > '{{ secrets_dir }}/db_root_password'"
        creates: "{{ secrets_dir }}/db_root_password"

    - name: Lock down secret file permissions (600)
      ansible.builtin.file:
        path: "{{ secrets_dir }}/{{ item }}"
        mode: "0600"
      loop:
        - app_key
        - db_password
        - db_root_password
