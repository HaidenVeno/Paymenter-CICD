# Ansible inventory — deploy targets reached from the Runner over the management
# network (mgmtnet 10.0.20.0/24). See docs/network-topology.md.
#
# Set ansible_user to your VM login and point ansible_ssh_private_key_file at the
# key the Runner uses to reach the targets. Deploys (secrets/certs/harden) run
# from the Runner via SSH against a single `deploy_target` (default: staging) —
# the Runner is the control node there, not a target. Base provisioning
# (provision.yml/docker.yml) is broader: it also covers the Runner itself
# (ansible_connection=local), scoped via `provision_target` (default: staging;
# pass -e provision_target=lab to provision the whole lab in one run).

[runner]
runner ansible_host=10.0.20.10 ansible_connection=local

[staging]
staging ansible_host=10.0.20.20

[prod_dmz]
prod-dmz ansible_host=10.0.20.30

[prod_app]
prod-app ansible_host=10.0.20.31

# Production = the DMZ proxy VM + the internal app VM
[production:children]
prod_dmz
prod_app

# All deploy targets (staging + production)
[targets:children]
staging
production

# Everything base-provisioning can reach: the Runner itself + all deploy targets
[lab:children]
runner
targets

[all:vars]
ansible_user=hveno
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/id_ed25519_deploy

# --- local fallback -----------------------------------------------------------
# If you are still running the runner AS the deploy target (single-host, pre-VM),
# use this group instead of the remote targets above:
# [homelab]
# localhost ansible_connection=local
