; Hardened supervisord config: runs entirely as the unprivileged `nginx` user.
; Key change vs upstream: the root `crond` that ran `schedule:run` is replaced
; by `artisan schedule:work` as a supervised non-root process, removing the
; last component that required root.
[unix_http_server]
file=/tmp/supervisor.sock

[supervisord]
logfile=/var/log/supervisord/supervisord.log
logfile_maxbytes=50MB
logfile_backups=2
loglevel=error
pidfile=/tmp/supervisord.pid
nodaemon=true
minfds=1024
minprocs=200
user=nginx
childlogdir=/var/log/supervisord/

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F
autostart=true
autorestart=true

[program:queue-worker]
command=/usr/local/bin/php /app/artisan queue:work --sleep=3 --tries=3
autostart=true
autorestart=true

[program:scheduler]
command=/usr/local/bin/php /app/artisan schedule:work
autostart=true
autorestart=true

[program:nginx]
command=/usr/sbin/nginx -g 'daemon off;'
autostart=true
autorestart=true
priority=10
stdout_events_enabled=true
stderr_events_enabled=true
