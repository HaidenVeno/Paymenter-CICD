[global]
; php-fpm master runs as nginx (set via USER in the Dockerfile), so it cannot
; and need not setuid. Pool user/group are therefore omitted and inherited.
; Default error_log path (/usr/local/var/log) is root-owned and unwritable by
; the nginx user, so send fpm's log to stderr where supervisord captures it.
error_log = /proc/self/fd/2
[www]
; surface PHP worker errors to the container log too
catch_workers_output = yes
decorate_workers_output = no
php_admin_value[error_log] = /proc/self/fd/2
php_admin_flag[log_errors] = on
listen = 127.0.0.1:9000

pm = ondemand
pm.max_children = 9
pm.process_idle_timeout = 10s
pm.max_requests = 200

clear_env = no
