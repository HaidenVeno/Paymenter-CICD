# Hardened app-container nginx vhost.
# Listens on an unprivileged port (8080) so the whole process tree can run as
# the non-root `nginx` user. TLS/redirects/security-headers are handled one hop
# up at the reverse proxy (docker/reverse-proxy/), not here.
server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /app/public;

    index index.php;

    # Trust the reverse proxy for the real scheme/host (fixes mixed-content:
    # Lab 5 HTTP->HTTPS asset URL regression). Paymenter also sets
    # URL::forceScheme via APP_URL/ASSET_URL env at runtime.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    access_log off;
    error_log  /var/log/nginx/paymenter.app-error.log error;

    client_max_body_size 100m;
    client_body_timeout 120s;

    sendfile off;

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param PHP_VALUE "upload_max_filesize = 100M \n post_max_size=100M";
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        fastcgi_intercept_errors off;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_connect_timeout 300;
        fastcgi_send_timeout 300;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }

    # Never serve dotfiles / VCS metadata / env from the app root.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
