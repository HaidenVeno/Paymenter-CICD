user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # No rate-limit zones / CORS map here — this is a plain TLS-terminating
    # passthrough to the app tier, not the WAF edge. Virtual patches 1-4 (Lab
    # 5 s5.1) already run once at Prod-DMZ (docker/reverse-proxy/nginx.dmz.conf
    # + conf.d/paymenter-dmz.conf); duplicating them here would be redundant,
    # not defense-in-depth (the DMZ proxy is the only thing that can reach
    # this host at all — harden.yml's DOCKER-USER rule enforces that).
    upstream paymenter_app {
        server paymenter:8080;
        keepalive 16;
    }

    include /etc/nginx/conf.d/app-edge.conf;
}
