# ---------------------------------------------------------------------------
# HTTP: unconditional 301 -> HTTPS (Lab 5 s3.8 forced-HTTPS fix).
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # ACME http-01 challenge path stays on HTTP for cert issuance/renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS: TLS termination + security headers + Lab 5 virtual patches.
# ---------------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name paymenter.homelab.local;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Phase 2: the upstream (Prod-App, over prodint) speaks HTTPS with a
    # self-signed cert. Pinned, not skipped — proxy_ssl_verify on validates
    # the presented cert against a trusted copy of it specifically (fetched
    # by ansible/playbooks/trust-app-cert.yml), and proxy_ssl_name checks the
    # cert's SAN matches. Network segmentation (harden.yml's DOCKER-USER rule
    # restricting Prod-App:443 to this host's prodint address) is the
    # backstop, not the primary control — see docs/allowlist.md.
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/nginx/certs/app-fullchain.pem;
    proxy_ssl_name prod-app.internal;

    # ---- Virtual patch 1: block ?include= on admin API (permission bypass) --
    # Blanket ARGS:include block on admin paths; returns 400 at the edge
    # regardless of app-layer state. Legitimate include use is an accepted
    # trade-off (documented in test-justification.md).
    location /api/v1/admin/ {
        include /etc/nginx/conf.d/security-headers.conf;
        if ($arg_include) { return 400; }

        # ---- Virtual patch 2: admin API rate limiting (60 r/m, burst 5) ----
        limit_req zone=admin_api burst=5 nodelay;

        proxy_pass https://paymenter_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ---- Virtual patch 3: cart coupon brute-force limit (5 r/m, burst 2) ----
    location /cart {
        include /etc/nginx/conf.d/security-headers.conf;
        limit_req zone=cart burst=2 nodelay;

        proxy_pass https://paymenter_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }

    # ---- Catch-all: CORS scoping (virtual patch 4, widened per Lab 5 s5.1) --
    location / {
        include /etc/nginx/conf.d/security-headers.conf;

        # Strip Paymenter's default wildcard ACAO and substitute a scoped value.
        proxy_hide_header Access-Control-Allow-Origin;
        add_header Access-Control-Allow-Origin $cors_allow_origin always;

        proxy_pass https://paymenter_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
}
