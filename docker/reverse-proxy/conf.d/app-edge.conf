# Internal TLS termination for the DMZ->App hop. Self-signed cert (see
# ansible/playbooks/certs.yml, tls_hostname="prod-app.internal" in
# group_vars/prod_app.yml) — trusted by Prod-DMZ via a pinned copy of this
# cert's public half (proxy_ssl_trusted_certificate in paymenter-dmz.conf),
# not a real CA. No HTTP->HTTPS redirect server: nothing but the DMZ proxy
# ever reaches this port (harden.yml's DOCKER-USER rule enforces that), and
# it already only speaks HTTPS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name prod-app.internal;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://paymenter_app;
        include /etc/nginx/conf.d/proxy-params.conf;
    }
}
