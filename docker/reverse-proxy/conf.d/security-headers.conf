# Security headers snippet.
#
# IMPORTANT (Lab 5 s5.1 nginx gotcha): `add_header` does NOT merge across
# nesting levels. The moment a `location` block declares its own add_header,
# every header inherited from the parent is dropped for that location. To keep
# the full set present everywhere, this snippet is `include`d inside EVERY
# location block rather than declared once at server level.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# CSP: ZAP baseline flagged "Content-Security-Policy Header Not Set" (10038)
# in Phase 1's post-deploy DAST run. 'unsafe-inline'/'unsafe-eval' on
# script-src are deliberate, not an oversight — Filament/Livewire ship inline
# event handlers and Alpine.js evaluates expressions via `new Function()`
# (x-data, x-show, etc.), so a strict/nonce-based CSP would need a much
# larger effort (custom nonce middleware, auditing every Blade/Livewire
# component) than this pass warrants. This still meaningfully restricts
# object/frame embedding and cross-origin fetches, and closes the "no CSP at
# all" gap. Documented in docs/allowlist.md; tightening to nonces is a
# reasonable follow-up, not required for Phase 1.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
