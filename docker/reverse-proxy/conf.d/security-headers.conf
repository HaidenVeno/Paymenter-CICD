# Security headers snippet.
#
# IMPORTANT (Lab 5 s5.1 nginx gotcha): `add_header` does NOT merge across
# nesting levels. The moment a `location` block declares its own add_header,
# every header inherited from the parent is dropped for that location. To keep
# the full set present everywhere, this snippet is `include`d inside EVERY
# location block rather than declared once at server level.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
