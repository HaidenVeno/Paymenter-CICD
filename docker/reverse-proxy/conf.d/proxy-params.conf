# Shared proxy parameters. X-Forwarded-Proto=https is what lets Paymenter
# generate https:// asset/Livewire URLs behind TLS termination (Lab 5 s3.8
# mixed-content fix). The app must also trust this proxy's subnet
# (trusted_proxies) for the header to be honored.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_read_timeout 300;

# ZAP baseline [10037]: PHP-FPM sends X-Powered-By: PHP/<version>, handing an
# attacker the exact runtime version to target. Strip it here (included in
# every proxying location across paymenter.conf, paymenter-dmz.conf, and
# app-edge.conf) rather than per-file, same pattern already used for
# Access-Control-Allow-Origin in paymenter.conf.
proxy_hide_header X-Powered-By;
