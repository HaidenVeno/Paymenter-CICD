user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    server_tokens off;
    client_max_body_size 100m;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    # --- Rate-limit zones (Lab 5 virtual patches 2 & 3) --------------------
    # Admin API: mirror the 60 req/min already enforced on /oauth/token.
    limit_req_zone $binary_remote_addr zone=admin_api:10m rate=60r/m;
    # Cart: throttle coupon brute-force via the URL-parameter path.
    limit_req_zone $binary_remote_addr zone=cart:10m rate=5r/m;
    limit_req_status 429;

    # --- CORS scoping (Lab 5 virtual patch 4) ------------------------------
    # Replace Paymenter's default wildcard ACAO with a scoped trusted origin.
    # Unlisted origins resolve to "" (no wildcard echoed back).
    map $http_origin $cors_allow_origin {
        default "";
        "https://paymenter.homelab.local" "https://paymenter.homelab.local";
    }

    upstream paymenter_app {
        server paymenter:8080;
        keepalive 16;
    }

    # Only the vhost is loaded here; security-headers.conf / proxy-params.conf
    # are include-snippets pulled in per-location, not standalone server files.
    include /etc/nginx/conf.d/paymenter.conf;
}
